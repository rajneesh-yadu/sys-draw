<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SysDraw — a flight simulator for system design." />
    <title>SysDraw</title>
    <script>
      // S21: apply the saved theme before first paint (no light flash); app/ui/theme.ts owns it after.
      (function () {
        var t = 'system';
        try {
          t = JSON.parse(localStorage.getItem('sysdraw.ui') || '{}').theme || 'system';
        } catch (e) {}
        var dark =
          t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
